Conditions:
  EnableSSHAccess: !Equals [!Ref EnableSSH, 'true']
  MultiNode: !Not [!Equals [!Ref NodeCount, 1]]
  ValidSSHKeyName: !Not [!Equals [!Ref SSHKeyName, 'no-ssh-key-needed']]
  HasThreeOrMoreAZs: !Not [!Or [!Equals [!Ref 'AWS::Region', 'us-west-1'], !Equals [!Ref 'AWS::Region', 'ap-northeast-3'], !Equals [!Ref 'AWS::Region', 'ca-central-1']]]
  LargeCluster: !Not [!Or [!Equals [!Ref NodeCount, 1], !Equals [!Ref NodeCount, 2], !Equals [!Ref NodeCount, 3]]]

Resources:
  # ==================== VPC and Networking ====================
  
  ShuffleVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-vpc'
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Shuffle

  ShuffleInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ShuffleVPC
      InternetGatewayId: !Ref ShuffleInternetGateway

  ShuffleSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ShuffleVPC
      CidrBlock: !Select [0, !Cidr [!Ref VpcCIDR, 4, 8]]
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select 
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-subnet-az1'
        - Key: AZ
          Value: !Select [0, !GetAZs '']

  ShuffleSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ShuffleVPC
      CidrBlock: !Select [1, !Cidr [!Ref VpcCIDR, 4, 8]]
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select 
        - 1
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-subnet-az2'
        - Key: AZ
          Value: !Select [1, !GetAZs '']

  ShuffleSubnet3:
    Type: AWS::EC2::Subnet
    Condition: HasThreeOrMoreAZs
    Properties:
      VpcId: !Ref ShuffleVPC
      CidrBlock: !Select [2, !Cidr [!Ref VpcCIDR, 4, 8]]
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select 
        - 2
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-subnet-az3'
        - Key: AZ
          Value: !Select [2, !GetAZs '']

  ShuffleRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ShuffleVPC
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-rt'

  ShuffleRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref ShuffleRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ShuffleInternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ShuffleSubnet1
      RouteTableId: !Ref ShuffleRouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ShuffleSubnet2
      RouteTableId: !Ref ShuffleRouteTable

  SubnetRouteTableAssociation3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasThreeOrMoreAZs
    Properties:
      SubnetId: !Ref ShuffleSubnet3
      RouteTableId: !Ref ShuffleRouteTable

  # ==================== Security Groups ====================

  ShuffleInternalSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${DeploymentName}-internal-sg'
      GroupDescription: Internal communication for Shuffle Docker Swarm cluster
      VpcId: !Ref ShuffleVPC
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-internal-sg'

  # Docker Swarm Internal Rules
  SwarmTCPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 2376
      ToPort: 2377
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: Docker Swarm management

  SwarmTCPIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 7946
      ToPort: 7946
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: Docker Swarm node communication

  SwarmUDPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: udp
      FromPort: 7946
      ToPort: 7946
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: Docker Swarm node communication

  SwarmUDPIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: udp
      FromPort: 4789
      ToPort: 4789
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: Docker overlay network

  # NFS for shared storage
  NFSTCPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: NFS

  NFSTCPIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 111
      ToPort: 111
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: NFS portmapper

  NFSTCPIngress3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 65535
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: NFS auxiliary services (mountd, statd, lockd)

  NFSUDPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: udp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: NFS

  NFSUDPIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: udp
      FromPort: 111
      ToPort: 111
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: NFS portmapper

  NFSUDPIngress3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: udp
      FromPort: 32768
      ToPort: 65535
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: NFS auxiliary services (mountd, statd, lockd)

  # Internal Shuffle services
  OpenSearchIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 9200
      ToPort: 9300
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: OpenSearch

  BackendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 5001
      ToPort: 5002
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: Shuffle backend

  WorkerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 33333
      ToPort: 33336
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: Shuffle workers

  MemcachedIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleInternalSG
      IpProtocol: tcp
      FromPort: 11211
      ToPort: 11211
      SourceSecurityGroupId: !Ref ShuffleInternalSG
      Description: Memcached

  ShuffleExternalSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${DeploymentName}-external-sg'
      GroupDescription: External access to Shuffle UI
      VpcId: !Ref ShuffleVPC
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-external-sg'

  # External access to Shuffle UI (port 3001) - support multiple CIDRs
  ExternalHTTPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShuffleExternalSG
      IpProtocol: tcp
      FromPort: 3001
      ToPort: 3001
      CidrIp: !Select [0, !Ref ExternalAccessCIDRs]
      Description: Shuffle UI access

  # SSH Security Group (conditional)
  ShuffleSSHSG:
    Type: AWS::EC2::SecurityGroup
    Condition: EnableSSHAccess
    Properties:
      GroupName: !Sub '${DeploymentName}-ssh-sg'
      GroupDescription: SSH access to Shuffle nodes
      VpcId: !Ref ShuffleVPC
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-ssh-sg'

  SSHIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableSSHAccess
    Properties:
      GroupId: !Ref ShuffleSSHSG
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Select [0, !Ref SSHAccessCIDRs]
      Description: SSH access

  # ==================== EC2 Placement Group ====================

  ShufflePlacementGroup:
    Type: AWS::EC2::PlacementGroup
    Properties:
      GroupName: !Sub '${DeploymentName}-placement-group'
      Strategy: !If [LargeCluster, 'partition', 'spread']
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-placement-group'
        - Key: Application
          Value: Shuffle

  # ==================== IAM Role ====================

  ShuffleInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ShuffleEC2Permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeNetworkInterfaces
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/shuffle/*'
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DeploymentName}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - 'arn:aws:s3:::shuffler/config/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - 'arn:aws:s3:::shuffler'
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'config/*'
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-instance-role'

  ShuffleInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ShuffleInstanceRole

  ShuffleLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${DeploymentName}-launch-template'
      LaunchTemplateData:
        # Use regional AMI mapping for Amazon Linux 2023
        ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
        InstanceType: !Ref InstanceType
        KeyName: !If 
          - EnableSSHAccess
          - !If
            - ValidSSHKeyName
            - !Ref SSHKeyName
            - !Ref 'AWS::NoValue'
          - !Ref 'AWS::NoValue'
        IamInstanceProfile:
          Arn: !GetAtt ShuffleInstanceProfile.Arn
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref VolumeSize
              VolumeType: !Ref VolumeType
              DeleteOnTermination: true
              Encrypted: true
        Placement:
          GroupName: !Ref ShufflePlacementGroup
          PartitionNumber: !If [LargeCluster, 1, !Ref 'AWS::NoValue']
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: !If
              - EnableSSHAccess
              - - !Ref ShuffleInternalSG
                - !Ref ShuffleExternalSG
                - !Ref ShuffleSSHSG
              - - !Ref ShuffleInternalSG
                - !Ref ShuffleExternalSG
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${DeploymentName}-node'
              - Key: Environment
                Value: !Ref Environment
              - Key: Application
                Value: Shuffle
              - Key: DeploymentName
                Value: !Ref DeploymentName
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                set -euo pipefail
                exec > >(tee /var/log/userdata.log) 2>&1
                echo "==== UserData bootstrap started $(date) ===="

                # ---- CloudFormation-injected parameters ----
                export DEPLOYMENT_NAME="${DeploymentName}"
                export TOTAL_NODES="${TotalNodes}"
                export AWS_REGION="${AwsRegion}"

                # ---- Download and run the main setup script ----
                SETUP_SCRIPT="/opt/shuffle-bootstrap/startup-setup.sh"
                mkdir -p /opt/shuffle-bootstrap

                echo "Downloading startup-setup.sh from S3..."
                aws s3 cp s3://shuffler/config/startup-setup.sh "$SETUP_SCRIPT" \
                  --region "$AWS_REGION"

                # Ensure Unix line endings and executable bit
                sed -i 's/\r$//' "$SETUP_SCRIPT"
                chmod +x "$SETUP_SCRIPT"

                echo "Executing startup-setup.sh..."
                bash "$SETUP_SCRIPT"

                echo "==== UserData bootstrap complete $(date) ===="
              - TotalNodes: !Ref NodeCount
                AwsRegion: !Ref AWS::Region
                DeploymentName: !Ref DeploymentName


  # ==================== Auto Scaling Group ====================

  ShuffleASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${DeploymentName}-asg'
      VPCZoneIdentifier: !If
        - HasThreeOrMoreAZs
        - - !Ref ShuffleSubnet1
          - !Ref ShuffleSubnet2
          - !Ref ShuffleSubnet3
        - - !Ref ShuffleSubnet1
          - !Ref ShuffleSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref ShuffleLaunchTemplate
        Version: !GetAtt ShuffleLaunchTemplate.LatestVersionNumber
      MinSize: !Ref NodeCount
      MaxSize: !Ref NodeCount
      DesiredCapacity: !Ref NodeCount
      HealthCheckType: EC2
      HealthCheckGracePeriod: !If [LargeCluster, 1200, 600]  # 20 min for large clusters, 10 min for small
      Tags:
        - Key: Name
          Value: !Sub '${DeploymentName}-node'
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true

  # ==================== CloudWatch Log Group ====================

  ShuffleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/shuffle/${DeploymentName}'
      RetentionInDays: 7

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref ShuffleVPC
    Export:
      Name: !Sub '${DeploymentName}-vpc-id'

  SubnetId1:
    Description: Subnet 1 ID (AZ1)
    Value: !Ref ShuffleSubnet1
    Export:
      Name: !Sub '${DeploymentName}-subnet-1-id'

  SubnetId2:
    Description: Subnet 2 ID (AZ2)
    Value: !Ref ShuffleSubnet2
    Export:
      Name: !Sub '${DeploymentName}-subnet-2-id'

  SubnetId3:
    Condition: HasThreeOrMoreAZs
    Description: Subnet 3 ID (AZ3)
    Value: !Ref ShuffleSubnet3
    Export:
      Name: !Sub '${DeploymentName}-subnet-3-id'

  SecurityGroupInternal:
    Description: Internal Security Group ID
    Value: !Ref ShuffleInternalSG
    Export:
      Name: !Sub '${DeploymentName}-internal-sg-id'

  SecurityGroupExternal:
    Description: External Security Group ID
    Value: !Ref ShuffleExternalSG
    Export:
      Name: !Sub '${DeploymentName}-external-sg-id'

  AutoScalingGroupName:
    Description: Auto Scaling Group Name
    Value: !Ref ShuffleASG

  PlacementGroupName:
    Description: EC2 Placement Group Name (Spread strategy for high-availability)
    Value: !Ref ShufflePlacementGroup
    Export:
      Name: !Sub '${DeploymentName}-placement-group'

  DeploymentName:
    Description: Deployment Name
    Value: !Ref DeploymentName

  ShuffleFrontendURL:
    Description: URL to access Shuffle Frontend (replace INSTANCE_IP with actual instance public IP)
    Value: !Sub 'http://INSTANCE_IP:3001'

  PostDeploymentInstructions:
    Description: Instructions after deployment
    Value: !Join
      - ''
      - - |
          =================================================================
          Shuffle Deployment In Progress!
          =================================================================
          
          The Shuffle cluster is being deployed with 
        - !Ref NodeCount
        - !Sub |2
           node(s).
          
          To access Shuffle:
          1. Wait 5-10 minutes for instances to initialize
          2. Get the public IP of any instance from EC2 console
          3. Access: http://INSTANCE_IP:3001
          
          To manage the cluster:
          - View running services: docker stack services shuffle
          - View logs: docker service logs shuffle_<service-name>
          - Check swarm status: docker node ls
          
          Security:
          - Only port 3001 is exposed externally
          - All internal services use VPC-internal communication
          
          =================================================================
