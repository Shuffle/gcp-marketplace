tests:

  # ----------------------------------------------------
  # Basic single-node minimal deployment test
  # ----------------------------------------------------
  single-node-basic:
    template: ./shuffle-marketplace.yaml
    parameters:
      DeploymentName: shuffle-vm
      Environment: dev
      NodeCount: 1
      InstanceType: t3.large
      VolumeSize: 120
      VolumeType: gp3
      ExternalAccessCIDRs: 0.0.0.0/0
      EnableSSH: "false"
      SSHAccessCIDRs: 10.0.0.0/8
      SSHKeyName: shuffle  # Uses default when SSH disabled

